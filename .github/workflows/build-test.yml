# Build and test
#
# Build, SLSA attest, and test the project.
#
# This workflow produces the following things which release.yml consumes:
#   1. $.jobs.build-test (this exact job ID)
#   2. The artifact named "build"
#
# Public repositories can use attest for free. Private repos require Enterprise Cloud.

name: Build and test

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup show
          rustup target add wasm32-wasip1

      - name: Test
        run: |
          cargo test --locked --target "$(rustc -vV | sed -n 's/^host: //p')"

      # zellij-plugin-snapshot is a command. [dependencies] would compile it into
      # the plugin wasm. https://github.com/fulldecent/zellij-plugin-snapshot
      - name: Install zellij-plugin-snapshot
        run: cargo install zellij-plugin-snapshot --version 0.2.2 --locked

      - name: Snapshot
        run: |
          export PATH="${HOME}/.cargo/bin:${PATH}"
          sh tests/snapshot.sh

      - name: Build
        run: |
          cargo build --release --locked
          mkdir -p dist
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          name="com.github.${owner}.${repo}.wasm"
          cp target/wasm32-wasip1/release/plugin.wasm "dist/${name}"

      - name: Attest the build
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      # After attesting, so the bundle is not one of its own subjects.
      - name: Add the attestation to the build
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/attestation.sigstore.json

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
          if-no-files-found: error
          retention-days: 14
